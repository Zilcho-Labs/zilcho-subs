[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zilcho-subs"
dynamic = ["version"]
description = "Local AI subtitles for your media and your language"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.dynamic]
version = {attr = "zilcho_subs.__version__"}

[project.optional-dependencies]
inference = ["faster-whisper==1.2.1", "ctranslate2==4.9.0", "av==18.1.0", "sentencepiece==0.2.3", "sacremoses==0.1.1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "numpy>=1.24"]

[tool.setuptools.package-data]
zilcho_subs = ["static/*", "static/licenses/*", "static/branding/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["zilcho_subs*"]
