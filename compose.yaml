services:
  zilcho-subs:
    build: .
    # Pulled from GitHub's registry; "docker compose build" builds it from source instead.
    image: ghcr.io/zilcho-labs/zilcho-subs:latest
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8765}:8765"
    environment:
      ZILCHO_PASSWORD: "${ZILCHO_PASSWORD:?Set a unique password of at least 12 characters}"
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      TZ: "${TZ:-UTC}"
      UMASK: "002"
    volumes:
      - "${APPDATA_PATH:-./config}:/config"
      - "${MEDIA_PATH:?Set MEDIA_PATH to your imported media library}:/media:rw"
      # Optional: downloads are mounted read-only and are not watched in v0.1.
      - "${DOWNLOADS_PATH:-./downloads}:/downloads:ro"
    cpus: "${CPU_LIMIT:-2}"
    mem_limit: "${MEMORY_LIMIT:-6g}"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
